name: build-release-assets

# Builds precompiled overlay + lsfg-vk assets on release tags and uploads
# them to the GitHub release. install.sh then downloads the matching
# tar.gz instead of compiling on the user machine:
#
#   https://github.com/Axforzi/mangoverlay/releases/download/<TAG>/mangoverlay-assets-<TAG>.tar.gz
#
# Layout inside the archive (flat, no host paths):
#   overlay/libMangoHud.so
#   overlay/libMangoHud_opengl.so
#   lsfg/liblsfg-vk-layer.so
#   lsfg/lsfg-vk-cli
#
# Runner: ubuntu-22.04 is the oldest runner GitHub still provides (glibc
# 2.35), so the binaries work on the widest set of user distros. Users on
# older glibc must still install with --build (compile locally).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout (with minhook submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            TAG=$(git describe --tags --abbrev=0)
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          echo "Building assets for: $TAG"

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-mako meson ninja-build cmake g++ pkg-config glslang-tools \
            libx11-dev libdbus-1-dev libxnvctrl-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libpciaccess-dev libvulkan-dev

      - name: Build overlay (MangoHud fork)
        run: |
          cd MangoHud
          meson setup build --buildtype=release -Dmangohudctl=true
          ninja -C build
          test -f build/src/libMangoHud.so || exit 1

      - name: Build lsfg-vk (with patches)
        run: |
          git clone --depth 1 https://git.lsfg-vk.dev/lsfg-vk.git /tmp/lsfg-vk
          for patch in patches/*.patch; do
            [ -f "$patch" ] || continue
            if git -C /tmp/lsfg-vk apply --check "$patch" 2>/dev/null; then
              git -C /tmp/lsfg-vk apply "$patch"
            elif ! git -C /tmp/lsfg-vk apply --reverse --check "$patch" 2>/dev/null; then
              echo "WARN: $patch not cleanly applicable; keeping current tree state"
            fi
          done
          cmake -S /tmp/lsfg-vk -B /tmp/lsfg-vk/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLSFGVK_BUILD_UI=OFF \
            -DLSFGVK_BUILD_CLI=ON \
            -DLSFGVK_BUILD_LAYER=ON
          cmake --build /tmp/lsfg-vk/build -j"$(nproc)"

      - name: Package assets
        run: |
          PKG=/tmp/assets
          mkdir -p "$PKG/overlay" "$PKG/lsfg"
          cp MangoHud/build/src/libMangoHud.so "$PKG/overlay/"
          cp MangoHud/build/src/libMangoHud_opengl.so "$PKG/overlay/"
          find /tmp/lsfg-vk/build -name 'liblsfg-vk-layer.so' -exec cp {} "$PKG/lsfg/" \;
          find /tmp/lsfg-vk/build -name 'lsfg-vk-cli' -exec cp {} "$PKG/lsfg/" \;
          test -s "$PKG/overlay/libMangoHud.so" || exit 1
          test -s "$PKG/overlay/libMangoHud_opengl.so" || exit 1
          test -s "$PKG/lsfg/liblsfg-vk-layer.so" || exit 1
          test -s "$PKG/lsfg/lsfg-vk-cli" || exit 1
          tar -C "$PKG" -czf "/tmp/mangoverlay-assets-$TAG.tar.gz" overlay lsfg
          ls -lh /tmp/mangoverlay-assets-*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="/tmp/mangoverlay-assets-$TAG.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --notes "Precompiled assets (overlay + lsfg-vk) for install.sh."
          fi
          echo "Release asset ready for $TAG"

  install-matrix:
    # Runs the real one-liner (curl | bash) in containers for the main
    # distros, against the precompiled assets built by the build job.
    # Every release tag re-validates the installer end-to-end; also runnable
    # manually (workflow_dispatch) against master.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        container:
          - archlinux:latest
          - fedora:latest
          - debian:12
          - ubuntu:22.04
          - ubuntu:24.04
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Resolve installer ref (tag or master)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "REF=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "REF=master" >> "$GITHUB_ENV"
          fi

      - name: Install curl/tar (distro-specific)
        run: |
          if command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm curl tar >/dev/null
          elif command -v dnf >/dev/null 2>&1; then
            dnf -y install curl tar >/dev/null
          else
            apt-get update -qq && apt-get install -y -qq curl tar
          fi

      - name: Run installer one-liner (prebuilt path)
        run: |
          echo "glibc: $(getconf GNU_LIBC_VERSION)"
          curl -fsSL "https://raw.githubusercontent.com/Axforzi/mangoverlay/$REF/install.sh" \
            | bash -s -- --yes
          test -d "$HOME/.local/share/vulkan/implicit_layer.d" || exit 1
          test -x "$HOME/.local/bin/mangoverlay" || {
            test -x /usr/local/bin/mangoverlay || exit 1
          }

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-matrix-${{ matrix.container }}
          path: |
            /tmp/*.log
            /tmp/mangoverlay-*.log

  build-local:
    # Validates the local-compile path (--build): old distro with old meson
    # must be upgraded via pip (meson >= 0.60) and MangoHud must compile.
    # Ubuntu 20.04 ships gcc-9 which cannot build lsfg-vk (needs C++20),
    # so --skip-lsfg is expected there.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:20.04
    steps:
      - name: Resolve installer ref (tag or master)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "REF=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "REF=master" >> "$GITHUB_ENV"
          fi

      - name: Install curl/tar
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq curl tar

      - name: Run installer one-liner (build-local with --skip-lsfg)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL "https://raw.githubusercontent.com/Axforzi/mangoverlay/$REF/install.sh" \
            | bash -s -- --yes --install-deps --skip-lsfg
          test -x /usr/local/bin/mangoverlay || exit 1
          meson --version | awk -F. '{ exit !($1*100+$2 >= 60) }' \
            || { echo "meson still < 0.60"; exit 1; }

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-local-diagnostics
          path: |
            /tmp/*.log
            /tmp/mangoverlay-*.log