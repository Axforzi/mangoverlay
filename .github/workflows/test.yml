name: test

# Gate for the logic that fails silently, plus a compile gate for the fork.
#
# The `tests` job is deliberately light: it compiles the extracted functions on
# its own and needs nothing but a compiler, so it stays in the low seconds.
#
# The `compile` job exists because build-release-assets.yml only runs on release
# tags. Without it, a compile error in vulkan.cpp / overlay.cpp / gamepad.cpp
# reaches master and is discovered only when a release is attempted. It mirrors
# the x86_64 build from that workflow on purpose: same runner, same dependencies,
# so the gate catches exactly what the release build would.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: tests/run_tests.sh

  compile:
    name: compile (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # x86_64 is the common case; i386 covers 32-bit native games and
        # Proton/DXVK titles (Terraria-style) that load the multilib layer.
        # Both were release-tag-only before this gate existed.
        arch: [x86_64, i386]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # meson's vcs_tag runs `git describe --tags`; a shallow clone has no
          # tags and would fail the build for the wrong reason.
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-mako meson ninja-build g++ pkg-config glslang-tools \
            libx11-dev libdbus-1-dev libxnvctrl-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libpciaccess-dev libvulkan-dev
          # 32-bit toolchain + dev headers, same set as build-release-assets.yml.
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y gcc-multilib g++-multilib \
            libvulkan-dev:i386 libx11-dev:i386 libdbus-1-dev:i386 \
            libwayland-dev:i386 libxkbcommon-dev:i386 libdrm-dev:i386 \
            libpciaccess-dev:i386

      - name: Build overlay (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          cd MangoHud
          meson setup build --buildtype=release -Dmangohudctl=true
          ninja -C build
          test -f build/src/libMangoHud.so || exit 1

      - name: Build overlay (i386)
        if: matrix.arch == 'i386'
        run: |
          cd MangoHud
          meson setup build32 --cross-file build-cross-i386.ini \
            --buildtype=release -Dmangohudctl=false \
            -Dwith_xnvctrl=disabled -Dmangoplot=disabled
          ninja -C build32
          test -f build32/src/libMangoHud.so || exit 1
          file build32/src/libMangoHud.so | grep -q 'ELF 32-bit' || exit 1
