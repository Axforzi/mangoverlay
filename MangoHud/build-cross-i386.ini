# Meson cross-file for the 32-bit (i386) overlay build used by the
# build-release-assets workflow and by local multilib builds:
#
#   meson setup build32 --cross-file build-cross-i386.ini \
#     --buildtype=release -Dmangohudctl=false \
#     -Dwith_xnvctrl=disabled -Dmangoplot=disabled
#   ninja -C build32
#
# Targets the same glibc as the x86_64 prebuilt assets (ubuntu-22.04 / glibc
# 2.35) via the distro's multilib -m32 toolchain, so both arches follow the
# same prebuilt policy. Requires the :i386 dev headers for the libs the build
# links against (vulkan, x11, dbus, wayland, xkbcommon, drm, pciaccess).
[binaries]
c = '/usr/bin/gcc'
cpp = '/usr/bin/g++'
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkgconfig = '/usr/bin/pkg-config'

[properties]
c_args = ['-m32']
c_link_args = ['-m32']
cpp_args = ['-m32']
cpp_link_args = ['-m32']
pkg_config_libdir = ['/usr/lib/i386-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'